[package]
name = "monocode-companion-mobile"
version = "0.1.1"
description = "MonoCode Companion iOS shell"
authors = ["MonoCode contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "monocode_companion_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
monocode-companion-core = { path = "../../core" }
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
base64 = "0.22"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = "3.7"

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-barcode-scanner = "2"

[workspace]
resolver = "2"
