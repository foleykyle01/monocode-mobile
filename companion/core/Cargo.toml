[package]
name = "monocode-companion-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal"] }
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
base64 = "0.22"
rand = "0.9"
subtle = "2"
fs2 = "0.4"
# Later libc releases hide Darwin routing definitions on iOS that netwatch
# currently imports. Pin the last compatible release until upstream catches up.
libc = "=0.2.183"

[dev-dependencies]
tempfile = "3"
